services:
  - type: web
    name: grind-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: CORS_ORIGINS
        # "*" accepts any origin (no auth/cookies on this API). Replace with a
        # comma-separated list to lock it down, e.g. https://grind-rose.vercel.app
        value: "*"
      - key: DATABASE_URL
        sync: false   # paste your Supabase Postgres connection string
      - key: AI_API_KEY
        sync: false   # optional, real Anthropic key (sk-ant-...)
